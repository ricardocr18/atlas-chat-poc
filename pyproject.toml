[tool.poetry]
name = "atlas-chat-poc"
version = "0.1.0"
description = "POC de sistema multi-agente com LangGraph, LangChain e FastAPI"
authors = ["Seu Nome <seu-email@gmail.com>"]
readme = "README.md"
packages = [{include = "agent_application", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langgraph = "^0.2.0"
langchain-community = "^0.3.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
openai = "^1.0"
motor = "^3.3"
psycopg2-binary = "^2.9"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.4"
ipython = "^8.0"
poethepoet = "^0.26"

[tool.poe.tasks]
serve = "uvicorn src.agent_application.main:app --reload --port 8000"
lint  = "ruff check ."
test  = "pytest tests/ -v"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"