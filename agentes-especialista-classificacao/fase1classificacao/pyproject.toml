[tool.poetry]
name = "atlas-classificacao-agent"
version = "0.1.0"
description = "Agente especialista em classificacao e pre-curadoria da solucao Atlas"
authors = ["Ricardo <ricardo@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
pymongo = "^4.7.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
